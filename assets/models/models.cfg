# Fit for each custom model in this folder — see README.md.
# name       scale=…   yaw=… (degrees)   y=… (offset)   auto=0/1
# The Ephemera also takes rig thresholds: wing_hinge=0.2 wing_min_y=0.45
# leg_max_y=0.3 (see README.md, "Animation").
# Only the characters and the first six slots need a line: every other
# slot (trees, rocks, buildings, animals…) is auto-fitted to the size the
# world spawns it at, and `scale`/`y` nudge that fit. A variant can have a
# line of its own (`tree_2 scale=1.2`). Lines for absent models are ignored.

ephemera     scale=6.0   yaw=180   y=-1.0
judith       scale=1.8   yaw=180   y=0
villager     scale=1.8   yaw=180   y=0
reed_tall    scale=1.0   yaw=0     y=0
reed         scale=1.0   yaw=0     y=0
gate         scale=1.0   yaw=0     y=0
mesa         scale=1.0   yaw=0     y=0
